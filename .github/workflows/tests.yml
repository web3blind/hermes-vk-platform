name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: '3.11'
      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          # The scoped gateway integration test imports env_loader and account_usage.
          python -m pip install pytest==9.1.1 pytest-asyncio==1.4.0 pyyaml==6.0.3 python-dotenv==1.2.3 httpx==0.28.1
          git clone --depth 1 https://github.com/NousResearch/hermes-agent.git /tmp/hermes-agent
          mkdir -p /tmp/hermes-agent/plugins/platforms/vk
          cp adapter.py plugin.yaml setup_helper.py __init__.py /tmp/hermes-agent/plugins/platforms/vk/
      - name: Syntax check
        run: python -m py_compile adapter.py setup_helper.py __init__.py tests/test_vk_adapter.py
        env:
          PYTHONPATH: /tmp/hermes-agent:.
      - name: Run tests
        run: python -m pytest -q tests/
        env:
          PYTHONPATH: /tmp/hermes-agent:.
